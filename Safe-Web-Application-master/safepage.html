<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="safepage.css" />
    <link rel="shortcut icon" href="Resources/hmbct.png" />
    <title>ArmourZero Web Application (Safe Mode)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>

    <div class="container">
      <div class="header">
        <img
          src="../Safe-Web-Application-master/armourzerologo.png"
          alt="ArmourZero Logo"
          class="header-logo"
        />
        <h1 class="header-title">ArmourZero Web Application</h1>
        <div class="mode-display" id="modeDisplay">SAFE</div>
      </div>

      <div class="button-container">
        <button
          class="action-button"
          onclick="loadContent('../Safe-Web-Application-master/CommandExecution/CommandExec-2.php');"
        >
          Command Execution
        </button>
        <button
          class="action-button"
          onclick="loadContent('XSS/XSS_level2.php')"
        >
          XSS
        </button>
        <button
          class="action-button"
          onclick="loadContent('Secrets/KeyExposureSafe.php')"
        >
          Secret Key Exposure
        </button>
        <button class="action-button" onclick="loadContent('SCA/SCASafe.php')">
          Vulnerable Dependency
        </button>
        <button class="action-button" onclick="loadContent('IaC/IaC_safe.php')">
          IaC Configuration
        </button>
      </div>

      <div id="content-display"></div>
    </div>

    <script>
      // Load PHP content dynamically
      function loadContent(url) {
        const container = document.getElementById("content-display");
        container.innerHTML = "<p style='text-align:center;'>Loading...</p>";

        fetch(url)
          .then((response) => {
            if (!response.ok) throw new Error("Failed to load content");
            return response.text();
          })
          .then((data) => {
            container.innerHTML = data;
            // Reattach form handlers for any forms loaded via AJAX
            attachFormHandlers();
          })
          .catch((error) => {
            container.innerHTML = `<p style="color:red; text-align:center;">${error}</p>`;
          });
      }

      // Handle form submissions without page refresh
      function attachFormHandlers() {
        const forms = document.querySelectorAll("#content-display form");
        forms.forEach((form) => {
          form.onsubmit = function (e) {
            e.preventDefault();
            const formData = new FormData(form);
            const url =
              form.action +
              (form.method.toUpperCase() === "GET"
                ? "?" + new URLSearchParams(formData).toString()
                : "");

            fetch(url, {
              method: form.method,
              body: form.method.toUpperCase() === "POST" ? formData : null,
            })
              .then((response) => response.text())
              .then((data) => {
                document.getElementById("content-display").innerHTML = data;
                attachFormHandlers(); // Reattach handlers for any new forms
              })
              .catch((error) => {
                document.getElementById(
                  "content-display"
                ).innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
              });
          };
        });
      }

      // Detect and display zoom level
      function detectZoom() {
        const zoomLevel = Math.round(window.devicePixelRatio * 100);
        document.getElementById(
          "zoomHelper"
        ).textContent = `Zoom: ${zoomLevel}%`;
      }

      // Initial detection and update on resize
      window.addEventListener("load", detectZoom);
      window.addEventListener("resize", detectZoom);

      // Initial load if needed
      document.addEventListener("DOMContentLoaded", function () {
        attachFormHandlers();
        detectZoom();
      });
    </script>
  </body>
</html>
